  <body>
    <div id="app">
      <!-- 首屏占位：JS 资源下载与 Vue 挂载期间避免白屏（渲染后被 Vue 整体替换） -->
      <div class="boot-splash">
        <div class="boot-spinner"></div>
        <p class="boot-title">全国高校大数据分析可视化平台</p>
        <p class="boot-sub">正在加载可视化引擎…</p>
      </div>
    </div>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #070c18;
        color: #e2e8f0;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border: 2px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-title { font-size: 15px; font-weight: 600; letter-spacing: 1px; margin: 0; }
      .boot-sub { font-size: 12px; color: #7d8ea8; margin: 0; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.ts"></script>
